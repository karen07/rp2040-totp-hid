name: Firmware
on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            make \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            python3
      - name: Verify ARM toolchain
        run: |
          arm-none-eabi-gcc --version
          printf '#include <cstdlib>\n' | arm-none-eabi-g++ -x c++ -std=c++17 -E - >/dev/null
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Prepare artifacts
        run: |
          set -euo pipefail
          test -s build/release/rp2040_totp_hid.uf2
          mkdir -p dist
          cp build/release/rp2040_totp_hid.uf2 dist/
          (
            cd dist
            sha256sum rp2040_totp_hid.uf2 > rp2040_totp_hid.uf2.sha256
          )
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: rp2040-totp-hid-firmware
          path: dist/
          if-no-files-found: error
  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: rp2040-totp-hid-firmware
          path: dist
      - name: Create GitHub Release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/rp2040_totp_hid.uf2 \
            dist/rp2040_totp_hid.uf2.sha256 \
            --clobber
